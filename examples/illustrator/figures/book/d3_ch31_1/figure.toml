# GP handbook figure D3_Ch31-1 (Grok action 4b437697-ff9f-4a3e-ba99-75a0c3629cf5), as a layered figure.
# labels.toml is the lettering read by OCR, then corrected by hand; it is never overwritten.
source = "source.png"
scale = 3

[trace]
colors = 128
tol = 20.0
speck = 1
# line art in the colour of the picture under it (navy banners stay navy, dark tissue grey)
outline_color = "picture"
# small, so the dashes of dashed arrows stay
min_piece = 3

[[layers]]
name = "colour"
kind = "trace-pieces"

[[layers]]
name = "outlines"
kind = "trace-outlines"

[[layers]]
name = "labels"
kind = "labels"
