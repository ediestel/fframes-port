# GP handbook figure D2_F49-4 (Grok action c3f84c02-5c8e-4fdd-8ebf-11ee6b53b20a), as a layered figure.
# labels.toml is the lettering read by OCR, then corrected by hand; it is never overwritten.
source = "source.png"
scale = 3

[trace]
colors = 128
tol = 20.0
speck = 1
# line art in the colour of the picture under it (navy banners stay navy, dark tissue grey)
outline_color = "picture"
# small, so the dashes of dashed arrows stay
min_piece = 3

[[layers]]
name = "colour"
kind = "trace-pieces"

[[layers]]
name = "outlines"
kind = "trace-outlines"

[[layers]]
name = "labels"
kind = "labels"
