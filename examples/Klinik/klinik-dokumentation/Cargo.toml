[package]
name = "klinik-dokumentation"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
fframes = { workspace = true, features = ["compile-time-svgtree", "cli"] }
fframes_skia_renderer = { workspace = true, features = ["metal"] }
fframes_native_player = { workspace = true, features = ["metal", "audio"] }
shared-narration = { path = "../../shared/narration" }

[lib]
name = "klinik_dokumentation"
path = "src/lib.rs"
doctest = false

[[bin]]
name = "klinik-dokumentation"
path = "src/main.rs"

