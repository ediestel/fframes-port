[package]
name = "fframes_rig_editor"
version = "1.3.0"
edition = "2024"
license = "MIT"
description = "Rig editor for 3D figures: carve away bridges between limbs and body on planes through the figure, place joints, in a native window"
publish = false

[[bin]]
name = "fframes-rig-editor"
path = "src/main.rs"

[dependencies]
fframes_rig = { path = "../fframes-rig" }
fframes_three_d = { path = "../fframes-three-d", features = ["gpu"] }
# The figure's Gaussian splats (read, drawn, posed with the rig).
fframes_vector = { path = "../fframes-vector" }

[target.'cfg(target_os = "macos")'.dependencies]
fframes_native_player = { workspace = true, features = ["metal"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
fframes_native_player = { workspace = true, features = ["vulkan"] }

[lints]
workspace = true
