[package]
name = "fframes_vector"
version = "1.3.0"
edition = "2024"
license = "MIT"
description = "Pictures and drawings to piece-based vector art: flat pieces, tracing, a piece document and a cached svgr tree for fframes"
homepage = "https://fframes.studio"

[lib]
doctest = false

[[bin]]
name = "fframes-vector"
path = "src/main.rs"

[dependencies]
# Not fframes: fframes re-exports this crate as `fframes::vector` (feature `vector`).
usvgr.workspace = true
# Rasterizes pieces for sprite atlases (the same CPU renderer fframes uses).
svgr.workspace = true
image = { version = "0.25", default-features = false, features = ["png"] }
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Triangulates piece outlines with holes for the glTF export (ISC).
earcutr = "0.4"

[dev-dependencies]
# Reads the exported .glb back in the tests (the same reader fframes-three-d uses).
gltf = { version = "1.4", default-features = false, features = ["utils", "names", "import"] }

[lints]
workspace = true
